<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>视频延迟闪烁块</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #000; color: #fff; overflow: hidden;
    font-family: "DejaVu Sans Mono", "Noto Sans Mono", monospace; cursor: none; }
  /* 左右两半反相翻转，铺满整个窗口；秒表和说明叠在右下角 */
  #fl, #fr { position: fixed; top: 0; bottom: 0; width: 50%; background: #000; }
  #fl { left: 0; } #fr { right: 0; }
  #hud { position: fixed; right: 1.5vmin; bottom: 1.5vmin; padding: 0.8vmin 1.4vmin; background: rgba(40, 40, 40, 0.85);
    border-radius: 1vmin; text-align: right; }
  #t { font-size: 5vmin; font-weight: bold; color: #ffd400; }
  #info { font-size: 1.6vmin; color: #bbb; line-height: 1.5; }
  #info.hide { display: none; }
</style>
</head>
<body>
<div id="fl"></div><div id="fr"></div>
<div id="hud">
  <div id="t">0.000</div>
  <div id="info">
    <div>左右两半反相翻转（一白一黑），间隔 <span id="lo"></span>–<span id="hi"></span> ms 随机；整屏平均亮度不变，相机自动曝光不跟着跳</div>
    <div>F / 双击：全屏　H：隐藏这段说明</div>
  </div>
</div>
<script>
// 每段持续时间在 [LO, HI] 内随机，间隔不规则，互相关只有一个峰
const LO = 150, HI = 600;
document.getElementById('lo').textContent = LO;
document.getElementById('hi').textContent = HI;
const fl = document.getElementById('fl'), fr = document.getElementById('fr'), tEl = document.getElementById('t'), info = document.getElementById('info');
let on = false, next = 0;
const origin = performance.now();
function tick(now) {
  if (now >= next) {
    on = !on;
    fl.style.background = on ? '#fff' : '#000';
    fr.style.background = on ? '#000' : '#fff';
    next = now + LO + Math.random() * (HI - LO);
  }
  tEl.textContent = ((now - origin) / 1000).toFixed(3);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
function full() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
  else document.exitFullscreen();
}
document.addEventListener('dblclick', full);
document.addEventListener('keydown', e => {
  if (e.key === 'f' || e.key === 'F') full();
  if (e.key === 'h' || e.key === 'H') info.classList.toggle('hide');
});
</script>
</body>
</html>
